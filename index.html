// ==========================================
// ★ 신규: Audio System (순수 8비트 사운드 엔진)
// ==========================================
const AudioSystem = {
	ctx: null,
	isInitialized: false,
	isBGMPlaying: false,

	// 브라우저 AudioContext 초기화 (유저 상호작용 필수)
	init() {
		if (this.isInitialized) return;
		window.AudioContext = window.AudioContext || window.webkitAudioContext;
		this.ctx = new AudioContext();
		this.isInitialized = true;
	},

	// 톤 제너레이터 (주파수, 파형, 길이, 볼륨)
	playTone(freq, type, duration, vol = 0.1) {
		if (!this.ctx || this.ctx.state === 'suspended') return;
		const osc = this.ctx.createOscillator();
		const gain = this.ctx.createGain();
		
		osc.type = type; 
		osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
		
		gain.gain.setValueAtTime(vol, this.ctx.currentTime);
		gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

		osc.connect(gain);
		gain.connect(this.ctx.destination);
		
		osc.start();
		osc.stop(this.ctx.currentTime + duration);
	},

	// 1. 점프음 (뾰잉~)
	playJump() {
		if (!this.ctx || this.ctx.state === 'suspended') return;
		const osc = this.ctx.createOscillator();
		const gain = this.ctx.createGain();
		osc.type = 'square';
		osc.frequency.setValueAtTime(150, this.ctx.currentTime);
		osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15); 
		gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
		gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
		
		osc.connect(gain); gain.connect(this.ctx.destination);
		osc.start(); osc.stop(this.ctx.currentTime + 0.15);
	},

	// 2. 피격음 (지직!)
	playHit() {
		this.playTone(100, 'sawtooth', 0.2, 0.15);
	},

	// 3. 사진 찍기 / 득점 (띠링!)
	playScore() {
		this.playTone(600, 'square', 0.1, 0.05);
		setTimeout(() => this.playTone(800, 'square', 0.15, 0.05), 100);
	},

	// 4. 무한 루프 8비트 BGM (아르페지오)
	playBGM() {
		if (!this.ctx || this.isBGMPlaying) return;
		this.isBGMPlaying = true;
		// C4, E4, G4, C5 (빠른 레트로 멜로디)
		const melody = [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 261.6, 196.0]; 
		let noteIndex = 0;

		const playNextNote = () => {
			if (!this.isBGMPlaying || GameInfo.isGameOver) return; // 게임오버 시 재생 중지
			this.playTone(melody[noteIndex], 'square', 0.15, 0.02);
			noteIndex = (noteIndex + 1) % melody.length;
			setTimeout(playNextNote, 200); // 200ms 마다 1노트씩 (BPM 150)
		};
		playNextNote();
	},

	stopBGM() {
		this.isBGMPlaying = false;
	}
};

const MapGenerator = {
	cache: {}, 
	getStageData(stageNum) {
		if (!this.cache[stageNum]) {
			const packageCount = Math.floor(Math.random() * 5) + 2; 
			let doorPool = [];
			for (let i = 0; i < 12; i++) doorPool.push(i < packageCount ? 1 : 0); 
			for (let i = doorPool.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[doorPool[i], doorPool[j]] = [doorPool[j], doorPool[i]];
			}
			const floors = [];
			for (let i = 0; i < 3; i++) floors.push({ doors: doorPool.slice(i * 4, (i + 1) * 4) });
			this.cache[stageNum] = { floors: floors, totalPackages: packageCount };
		}
		return this.cache[stageNum];
	}
};

const SmallEnemyManager = {
	enemies: [],
	initForStage(stage) {
		this.enemies = [];
		let count = stage < 3 ? 1 : 2; 
		const types = ['vase', 'banana', 'baseball', 'trashbag', 'pigeon', 'cat'];
		let availableFloors = [0, 1, 2].sort(() => Math.random() - 0.5);

		for(let i = 0; i < count; i++) {
			if (availableFloors.length === 0) break;
			let type = types[Math.floor(Math.random() * types.length)];
			let validFloor = -1;
			let validDoorIdx = -1;
			
			for (let f of availableFloors) {
				const stageData = MapGenerator.getStageData(GameInfo.currentStage);
				let possibleDoors = [];
				let playerStartX = Renderer.width - Renderer.elevWidth - 48 - 20; 

				stageData.floors[f].doors.forEach((doorState, idx) => {
					let doorStartX = Renderer.elevWidth + 16 + (idx * (Renderer.doorWidth + 16));
					if (doorState === 0) {
						if (f === 0 && Math.abs(doorStartX - playerStartX) < 80) return; 
						possibleDoors.push(idx); 
					}
				});
				if (possibleDoors.length > 0) {
					validFloor = f; validDoorIdx = possibleDoors[Math.floor(Math.random() * possibleDoors.length)]; break;
				}
			}

			if (validFloor !== -1) {
				availableFloors = availableFloors.filter(fl => fl !== validFloor); 
				let doorStartX = Renderer.elevWidth + 16 + (validDoorIdx * (Renderer.doorWidth + 16));
				let spawnX = type === 'pigeon' ? doorStartX : doorStartX + 10;
				let boundaryEndX = type === 'pigeon' ? doorStartX + Renderer.doorWidth - 24 : 0;

				this.enemies.push({
					type: type, floor: validFloor, x: spawnX, y: 0, width: 24, height: 24, 
					startX: spawnX, endX: boundaryEndX, 
					vx: type === 'pigeon' ? 0.6 : 0, dir: 1, opacity: 0, isFading: false 
				});
			}
		}
	},
	spawnDynamic(type, floor, x) {
		this.enemies.push({
			type: type, floor: floor, x: x, y: 0, width: 24, height: 24, 
			startX: x, endX: 0, vx: 0, dir: 1, opacity: 0, isFading: false 
		});
	},
	update() {
		this.enemies.forEach(e => {
			let floorY = Renderer.gameHeight - (e.floor * Renderer.floorHeight) - 16;
			e.y = floorY - e.height; 
			if (e.isFading) e.opacity -= 0.1;
			else if (e.opacity < 1) e.opacity += 0.05; 

			if (e.type === 'pigeon' && !e.isFading) {
				e.x += e.vx * e.dir;
				if (e.x >= e.endX) { e.x = e.endX; e.dir = -1; } 
				else if (e.x <= e.startX) { e.x = e.startX; e.dir = 1; }
			}
		});
		this.enemies = this.enemies.filter(e => !(e.isFading && e.opacity <= 0));
	},
	render(ctx, yOffset) {
		this.enemies.forEach(e => {
			let img = Renderer.assets['enemy_' + e.type];
			if (e.type === 'pigeon') img = Renderer.assets[Math.floor(Date.now() / 200) % 2 === 0 ? 'enemy_pigeon1' : 'enemy_pigeon2'];
			if (e.type === 'vase') img = Renderer.assets[Math.floor(Date.now() / 400) % 2 === 0 ? 'enemy_vase1' : 'enemy_vase2'];
			let catIdleY = (e.type === 'cat' && Math.floor(Date.now() / 400) % 2 === 0) ? Math.floor(Renderer.scale / 2) : 0;

			ctx.save();
			ctx.globalAlpha = Math.max(0, Math.min(1, e.opacity)); 
			if (e.type === 'pigeon' && e.dir === -1) {
				ctx.translate(e.x + e.width, e.y + yOffset);
				ctx.scale(-1, 1);
				ctx.drawImage(img, 0, 0); 
			} else {
				ctx.drawImage(img, e.x, e.y + yOffset + catIdleY);
			}
			ctx.restore();
		});
	}
};

const MediumEnemyManager = {
	enemies: [],
	initForStage(stage) {
		this.enemies = [];
		if (stage < 2) return; 
		
		let count = 1; 
		const types = ['kid', 'tosa', 'kickboard', 'blackcat'];
		
		for(let i=0; i<count; i++) {
			let type = types[Math.floor(Math.random() * types.length)];
			let floor = Math.floor(Math.random() * 3);
			
			let e = {
				type: type, floor: floor, width: 48, height: 48, 
				opacity: 0, isFading: false, state: 'normal'
			};

			if (type === 'kid') {
				e.x = Renderer.elevWidth + 20; e.dir = 1; e.vx = Player.speed * 0.5; e.dropCount = 0; e.waitTimer = 0; e.targetFloor = floor;
			} else if (type === 'tosa') {
				e.doorX1 = Renderer.elevWidth + 16 + (0 * (Renderer.doorWidth + 16));
				e.doorX2 = Renderer.elevWidth + 16 + (3 * (Renderer.doorWidth + 16));
				e.x = e.doorX1;
				e.dir = 1; e.vx = Player.speed; e.waitTimer = 60; e.state = 'spawning';
			} else if (type === 'kickboard') {
				e.floor = 2; // 3층에서 시작
				e.floorDir = -1; 
				e.x = Renderer.elevWidth; e.dir = 1; e.vx = Player.speed * 1.5; e.state = 'running';
			} else if (type === 'blackcat') {
				let doorIdx = Math.floor(Math.random() * 4);
				e.x = Renderer.elevWidth + 16 + (doorIdx * (Renderer.doorWidth + 16)) + 10;
				e.vx = 0; e.vy = 0; e.state = 'idle';
			}
			
			this.enemies.push(e);
		}
	},

	update() {
		this.enemies.forEach(e => {
			let floorY = Renderer.gameHeight - (e.floor * Renderer.floorHeight) - 16;
			e.y = floorY - e.height;

			if (e.isFading) {
				e.opacity -= 0.1;
				return; 
			} else if (e.opacity < 1 && e.type !== 'kickboard' && e.type !== 'tosa') {
				e.opacity += 0.05; 
			}

			if (e.type === 'kid') {
				if (e.state === 'elevator') {
					e.waitTimer--;
					if (e.waitTimer <= 0) {
						e.floor = e.targetFloor; e.state = 'normal'; e.dir *= -1; e.x += (e.dir * 10);
					}
				} else {
					e.x += e.vx * e.dir;
					if (e.dropCount < 2 && Math.random() < 0.005) {
						e.dropCount++;
						SmallEnemyManager.spawnDynamic('baseball', e.floor, e.x);
					}
					if (e.x <= Renderer.elevWidth || e.x >= Renderer.width - Renderer.elevWidth - e.width) {
						e.state = 'elevator'; e.waitTimer = 60; 
						e.targetFloor = (e.floor + (Math.random() < 0.5 ? 1 : 2)) % 3; 
					}
				}
			} 
			else if (e.type === 'tosa') {
				if (e.state === 'spawning') {
					e.waitTimer--;
					e.opacity += (1 / 60); 
					if (e.waitTimer <= 0) { e.state = 'walking'; e.opacity = 1; }
				} else if (e.state === 'entering') {
					e.waitTimer--;
					e.opacity -= (1 / 60); 
					if (e.waitTimer <= 0) { 
						e.state = 'waiting'; 
						e.waitTimer = 180; 
						e.opacity = 0; 
					} 
				} else if (e.state === 'waiting') {
					e.waitTimer--;
					if (e.waitTimer <= 0) {
						e.state = 'spawning'; 
						e.waitTimer = 60; 
						e.dir *= -1; 
						e.x = e.dir === 1 ? e.doorX1 : e.doorX2; 
					}
				} else if (e.state === 'walking') {
					e.x += e.vx * e.dir;
					if (Math.random() < 0.1) ParticleSystem.spawn(e.x + e.width/2, floorY, 1, false);
					
					let targetX = e.dir === 1 ? e.doorX2 : e.doorX1;
					if ((e.dir === 1 && e.x >= targetX) || (e.dir === -1 && e.x <= targetX)) {
						e.state = 'entering'; e.waitTimer = 60; e.x = targetX;
					}
				}
			}
			else if (e.type === 'kickboard') {
				if (e.state === 'waiting') {
					e.waitTimer--;
					if (e.waitTimer <= 0) {
						e.floor += e.floorDir;
						if (e.floor <= 0) { e.floor = 0; e.floorDir = 1; } 
						else if (e.floor >= 2) { e.floor = 2; e.floorDir = -1; }
						
						e.state = 'running'; 
						e.dir *= -1; 
						e.x = e.dir === 1 ? Renderer.elevWidth : Renderer.width - Renderer.elevWidth - e.width;
						e.opacity = 0;
					}
				} else {
					e.x += e.vx * e.dir;
					let distFromEdge = Math.min(e.x - Renderer.elevWidth, Renderer.width - Renderer.elevWidth - e.width - e.x);
					if (distFromEdge < 100) e.opacity = Math.max(0, distFromEdge / 100);
					else e.opacity = 1;
					
					if (e.x <= Renderer.elevWidth || e.x >= Renderer.width - Renderer.elevWidth - e.width) {
						e.state = 'waiting'; 
						e.waitTimer = 180; 
					}
				}
			}
			else if (e.type === 'blackcat') {
				if (e.state === 'idle') {
					if (Player.currentFloorIndex === e.floor && Math.abs(Player.x - e.x) < 120) {
						e.state = 'jumping'; 
						e.dir = Player.x < e.x ? -1 : 1;
						e.vx = Player.speed * e.dir * 1.5; 
						e.vy = -10; 
					}
				} else if (e.state === 'jumping') {
					e.vy += Player.gravity * 0.5; 
					e.x += e.vx; e.y += e.vy;
					if (e.y >= floorY - e.height) { e.isFading = true; }
					if (Player.isDodging && Math.abs(Player.x - e.x) < 30) { e.isFading = true; }
				}
			}
		});
		this.enemies = this.enemies.filter(e => !(e.isFading && e.opacity <= 0));
	},

	render(ctx, yOffset) {
		this.enemies.forEach(e => {
			if (e.state === 'elevator' || e.state === 'waiting') return; 
			
			if (e.type === 'tosa' && (e.state === 'spawning' || e.state === 'entering')) {
				ctx.drawImage(Renderer.assets['door_open'], e.x + 10, e.y + yOffset);
			}

			let img;
			let animTick = Math.floor(Date.now() / 200) % 2 === 0;
			if (e.type === 'kid') img = Renderer.assets[animTick ? 'med_kid_1' : 'med_kid_2'];
			else if (e.type === 'tosa') img = Renderer.assets[animTick ? 'med_tosa_1' : 'med_tosa_2'];
			else if (e.type === 'kickboard') img = Renderer.assets['med_kickboard'];
			else if (e.type === 'blackcat') img = Renderer.assets[e.state === 'idle' ? 'med_blackcat_1' : 'med_blackcat_2'];

			ctx.save();
			ctx.globalAlpha = Math.max(0, Math.min(1, e.opacity)); 
			
			let drawX = e.x; let drawY = e.y + yOffset;
			
			if (e.dir === -1 && e.type !== 'kid') { 
				ctx.translate(drawX + e.width, drawY);
				ctx.scale(-1, 1);
				ctx.drawImage(img, 0, 0); 
			} else {
				ctx.drawImage(img, drawX, drawY);
			}
			ctx.restore();
		});
	}
};

const ThiefSystem = {
	active: false, boxesToSteal: [], progress: 0, targetFloor: 0, targetX: 0, 
	isClearingStage: false, isMidGameAutoSteal: false, isFleeing: false, 
	start(unphotoedBoxes, tFloor, tX, isClearing, isMidGame = false) {
		this.active = true; this.progress = 0; this.targetFloor = tFloor; this.targetX = tX; 
		this.isClearingStage = isClearing; this.isMidGameAutoSteal = isMidGame; this.isFleeing = false;

		const stageData = MapGenerator.getStageData(GameInfo.currentStage);
		const doors = stageData.floors[Player.currentFloorIndex].doors;
		const originalGrayIndices = [];
		doors.forEach((val, idx) => { if (val === 0) originalGrayIndices.push(idx); });

		let singleBoxToSteal = [unphotoedBoxes[0]]; 

		this.boxesToSteal = singleBoxToSteal.map(b => {
			let thiefDoorX;
			if (originalGrayIndices.length > 0) {
				let randIdx = originalGrayIndices[Math.floor(Math.random() * originalGrayIndices.length)];
				thiefDoorX = Renderer.elevWidth + 16 + (randIdx * (Renderer.doorWidth + 16)) + Renderer.doorWidth / 2;
			} else {
				thiefDoorX = Renderer.elevWidth / 2; 
			}
			return { box: b, doorX: thiefDoorX, originalBoxX: b.x };
		});
	},
	update() {
		if (!this.active) return;
		if (this.isFleeing) {
			this.progress -= 5; 
			if (this.progress <= 0) {
				this.active = false;
				if (!this.isMidGameAutoSteal) {
					if (this.isClearingStage) Player.executeClearStage();
					else Player.executeTeleport(this.targetFloor, this.targetX);
				}
			}
			return; 
		}

		this.progress += 2; 
		if (this.progress >= 100) {
			this.active = false;
			this.boxesToSteal.forEach(steal => {
				GameInfo.life -= 1.0; 
				AudioSystem.playHit(); // ★ 도둑에게 맞았을 때 사운드
				let idx = GameInfo.droppedBoxes.indexOf(steal.box);
				if (idx > -1) GameInfo.droppedBoxes.splice(idx, 1); 
			});
			
			if (GameInfo.life <= 0) { 
				GameInfo.gameOverReason = 'fired'; GameInfo.isGameOver = true; GameInfo.gameOverTime = Date.now();
				AudioSystem.stopBGM(); // ★ 게임오버 시 브금 정지
				return; 
			}

			if (!this.isMidGameAutoSteal) {
				if (this.isClearingStage) Player.executeClearStage();
				else Player.executeTeleport(this.targetFloor, this.targetX);
			}
		}
	},
	render(ctx) {
		if (!this.active) return;
		ctx.fillStyle = '#FFCCAA'; 
		this.boxesToSteal.forEach(steal => {
			let startX = steal.doorX; let endX = steal.box.x + 12; let baseY = Player.groundY - 20;
			let currentX = startX;
			if (this.progress < 50) currentX = startX + (endX - startX) * (this.progress / 50);
			else { 
				currentX = endX - (endX - startX) * ((this.progress - 50) / 50); 
				if (!this.isFleeing) steal.box.x = currentX - 12; 
			}
			let left = Math.min(startX, currentX); let w = Math.abs(currentX - startX);
			ctx.fillRect(left, baseY, w, 6); ctx.fillRect(currentX - 3, baseY - 2, 6, 10); 
		});
	}
};

const IntroSystem = {
	active: false, truckX: -200, truckY: 0, opacity: 1.0, state: 'driving', waitTimer: 30,
	init() {
		this.active = true; this.truckX = -200; this.truckY = Renderer.gameHeight - 16 - (12 * 4); 
		this.opacity = 1.0; this.state = 'driving'; this.waitTimer = 20; 
	},
	update() {
		if (this.state === 'driving') {
			this.truckX += 6; 
			if (this.truckX >= Renderer.width - 150) this.state = 'waiting';
		} else if (this.state === 'waiting') {
			this.waitTimer--;
			if (this.waitTimer <= 0) this.state = 'fading';
		} else if (this.state === 'fading') {
			this.opacity -= 0.03; 
			if (this.opacity <= 0) this.active = false; 
		}
	},
	render(ctx) {
		if (!this.active) return;
		ctx.save(); ctx.globalAlpha = Math.max(0, this.opacity);
		ctx.drawImage(Renderer.assets['truck'], this.truckX, this.truckY);
		ctx.restore();
	}
};

const ParticleSystem = {
	particles: [],
	spawn(x, y, count, isBig) {
		for(let i=0; i<count; i++) {
			this.particles.push({
				x: x, y: y,
				vx: (Math.random() - 0.5) * (isBig ? 15 : 5), 
				vy: Math.random() * -5 - (isBig ? 3 : 1),     
				life: isBig ? 25 : 15, size: isBig ? Math.random() * 4 + 3 : 2      
			});
		}
	},
	update() {
		this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
		this.particles = this.particles.filter(p => p.life > 0);
	},
	render(ctx) {
		ctx.fillStyle = 'rgba(200, 200, 200, 0.7)';
		this.particles.forEach(p => { ctx.fillRect(p.x, p.y, p.size, p.size); });
	}
};

// ==========================================
// 3. Renderer
// ==========================================
const Renderer = {
	ctx: null, width: 400, height: 700, gameHeight: 600, uiHeight: 100, scale: 5, 
	floorHeight: 0, assets: {}, beamPattern: null, elevWidth: 0, doorWidth: 0, objHeight: 0, 

	init(canvasId) {
		const canvas = document.getElementById(canvasId);
		canvas.width = this.width; canvas.height = this.height;
		this.ctx = canvas.getContext('2d');
		this.floorHeight = this.gameHeight / 3; 
		this.elevWidth = 8 * this.scale; this.doorWidth = 12 * this.scale; this.objHeight = 24 * this.scale; 
	},

	preRender(name, data, s) {
		const offCanvas = document.createElement('canvas');
		offCanvas.width = data[0].length * s; offCanvas.height = data.length * s;
		const oCtx = offCanvas.getContext('2d');
		for (let r = 0; r < data.length; r++) {
			for (let c = 0; c < data[r].length; c++) {
				if (data[r][c] !== 0 && PALETTE[data[r][c]]) {
					oCtx.fillStyle = PALETTE[data[r][c]];
					oCtx.fillRect(c * s, r * s, s, s);
				}
			}
		}
		this.assets[name] = offCanvas;
		if (name === 'beam') this.beamPattern = this.ctx.createPattern(offCanvas, 'repeat-x');
	},

	drawStageBlock(stageNum, yOffset) {
		this.ctx.fillStyle = '#1A1A24'; this.ctx.fillRect(0, yOffset, this.width, this.gameHeight);
		const stageData = MapGenerator.getStageData(stageNum);
		const baseFloor = (stageNum - 1) * 3 + 1; 
		
		for (let i = 0; i < 3; i++) {
			const floorTopY = yOffset + this.gameHeight - ((i + 1) * this.floorHeight);
			const floorBottomY = floorTopY + this.floorHeight;
			this.ctx.fillStyle = this.beamPattern;
			this.ctx.fillRect(0, floorBottomY - 16, this.width, 16);
			const baseY = floorBottomY - 16 - this.objHeight;
			
			this.ctx.drawImage(this.assets['elev'], 0, baseY); 
			this.ctx.drawImage((baseFloor + i === 1) ? this.assets['entrance'] : this.assets['elev'], this.width - this.elevWidth, baseY); 
			
			const gap = 16; 
			stageData.floors[i].doors.forEach((doorState, index) => {
				const doorX = this.elevWidth + gap + (index * (this.doorWidth + gap));
				this.ctx.drawImage(doorState === 1 ? this.assets['yellowDoor'] : this.assets['greenDoor'], doorX, baseY);
				
				const currentActualFloor = baseFloor + i;
				const roomNumber = `${currentActualFloor}0${4 - index}`; 
				
				this.ctx.save();
				this.ctx.fillStyle = '#7F8C8D'; 
				this.ctx.font = 'bold 12px "Courier New", monospace';
				this.ctx.textAlign = 'center';
				this.ctx.fillText(roomNumber, doorX + (this.doorWidth / 2), baseY - 5);
				this.ctx.restore();
			});
		}
	},

	drawDroppedBoxes(yOffset) {
		GameInfo.droppedBoxes.forEach(box => {
			this.ctx.drawImage(this.assets['box'], box.x, box.y + yOffset);
			if (box.photographed) {
				this.ctx.fillStyle = '#2ECC71';
				this.ctx.fillRect(box.x + 8, box.y + yOffset - 4, 8, 8);
			}
		});
	},

	drawUI() {
		this.ctx.fillStyle = '#1A252C'; this.ctx.fillRect(0, this.gameHeight, this.width, this.uiHeight);
		this.ctx.fillStyle = '#E74C3C'; this.ctx.fillRect(0, this.gameHeight, this.width, 4);
		
		this.ctx.textAlign = 'left'; this.ctx.font = '11px "Malgun Gothic", sans-serif'; this.ctx.fillStyle = '#BDC3C7';
		this.ctx.fillText("⬅️➡️ 스와이프: 걷기", 15, this.gameHeight + 30);
		this.ctx.fillText("⬆️ 스와이프: 무적 회피 유지", 15, this.gameHeight + 50); 
		this.ctx.fillText("⬇️ 스와이프: 택배 놓기", 15, this.gameHeight + 70);
		this.ctx.fillText("더블 탭: 점프", 15, this.gameHeight + 90);

		const camImg = this.assets['camera'];
		const camX = this.width - 120; 
		const camY = this.gameHeight + 15;
		this.ctx.drawImage(camImg, camX, camY);
		this.ctx.fillStyle = '#ECF0F1'; this.ctx.font = 'bold 12px monospace'; this.ctx.textAlign = 'center';
		this.ctx.fillText("TAKE PHOTO", camX + camImg.width / 2, camY + camImg.height + 15);

		let currentBillImg = this.assets['bill_1000']; 
		if (GameInfo.score >= 50000) currentBillImg = this.assets['bill_50000']; 
		else if (GameInfo.score >= 10000) currentBillImg = this.assets['bill_10000']; 
		
		this.ctx.drawImage(currentBillImg, 15, 15);
		this.ctx.fillStyle = '#FFF'; this.ctx.textAlign = 'left'; this.ctx.font = 'bold 18px monospace';
		this.ctx.fillText(` ${GameInfo.score.toLocaleString()}₩`, 15 + currentBillImg.width + 5, 33);

		const heartSize = 14; const heartStartX = this.width - 15 - (5 * 20); 
		for(let i = 0; i < 5; i++) {
			let hImg = this.assets['heart_empty'];
			if (GameInfo.life >= i + 1) hImg = this.assets['heart_full'];
			else if (GameInfo.life > i) hImg = this.assets['heart_half']; 
			this.ctx.drawImage(hImg, heartStartX + (i * 20), 15, heartSize, heartSize);
		}

		if (GameInfo.isGameOver) {
			this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; 
			this.ctx.fillRect(0, 0, this.width, this.height); 
			
			if (GameInfo.gameOverReason === 'hospital') {
				let elapsed = Date.now() - GameInfo.gameOverTime;
				let ambX = -200;
				let ambY = this.gameHeight / 2 + 100;
				
				if (elapsed < 2000) {
					ambX = -200 + (elapsed / 2000) * (this.width / 2 + 100);
				} else if (elapsed < 4000) {
					ambX = this.width / 2 - 100;
					this.ctx.drawImage(this.assets['driver_lean'], this.width / 2 - 20, ambY + 20);
				} else {
					ambX = this.width / 2 - 100 + ((elapsed - 4000) / 2000) * (this.width);
				}
				
				this.ctx.drawImage(this.assets['ambulance'], ambX, ambY);
			}

			this.ctx.fillStyle = '#E74C3C';
			this.ctx.textAlign = 'center';
			this.ctx.font = 'bold 28px "Malgun Gothic", sans-serif';
			
			let goText = GameInfo.gameOverReason === 'hospital' ? "당신은 병원에 가게 되었습니다" : "당신은 해고 되었습니다";
			this.ctx.fillText(goText, this.width / 2, this.gameHeight / 2 - 40);
			
			this.ctx.fillStyle = '#F1C40F';
			this.ctx.font = 'bold 20px monospace';
			this.ctx.fillText(`최종 수익: ${GameInfo.score.toLocaleString()}₩`, this.width / 2, this.gameHeight / 2 + 10);
			
			if (Math.floor(Date.now() / 500) % 2 === 0) {
				this.ctx.fillStyle = '#ECF0F1';
				this.ctx.font = 'bold 18px "Malgun Gothic", sans-serif';
				this.ctx.fillText("> 인생 역전 다시 시작하기 <", this.width / 2, this.gameHeight / 2 + 70);
			}

			if (GameInfo.gameOverReason === 'fired') {
				let animTick = Math.floor(Date.now() / 400) % 2 === 0;
				let bossImg = this.assets[animTick ? 'boss_idle_1' : 'boss_idle_2'];
				let bowImg = this.assets[animTick ? 'driver_bow_1' : 'driver_bow_2'];
				
				this.ctx.drawImage(bossImg, this.width / 2 - 60, this.gameHeight / 2 + 120);
				this.ctx.drawImage(bowImg, this.width / 2 + 10, this.gameHeight / 2 + 120);
			}
		}
	},

	clear() {
		this.ctx.fillStyle = '#000'; this.ctx.fillRect(0, 0, this.width, this.height);
	}
};

// ==========================================
// 4. Player & Input
// ==========================================
const Player = {
	x: 0, y: 0, width: 48, height: 72, 
	vx: 0, vy: 0, speed: 2.56, jumpPower: -19.5, gravity: 1.4, 
	isGrounded: false, isDodging: false, facingRight: false, isStunned: false, stunTimer: 0,
	groundY: 0, dodgeTimer: 0, savedVx: 0, stopTime: 0, packages: 0, currentFloorIndex: 0, teleportCooldown: 0,
	
	isSlipping: false, slipTimer: 0, 
	catTimer: 0, 
	invincibleTimer: 0,

	init() { this.resetForNewStage(); },

	resetForNewStage() {
		const currentStageData = MapGenerator.getStageData(GameInfo.currentStage);
		this.packages = currentStageData.totalPackages; 
		this.currentFloorIndex = 0; this.teleportCooldown = 60; 
		this.x = Renderer.width - Renderer.elevWidth - this.width - 20; 
		this.updateGroundY(); this.vx = 0; this.savedVx = 0;
		
		this.isSlipping = false; this.slipTimer = 0;
		this.catTimer = 0; 
		this.invincibleTimer = 0;
		this.isStunned = false; 
		this.isDodging = false;

		SmallEnemyManager.initForStage(GameInfo.currentStage);
		MediumEnemyManager.initForStage(GameInfo.currentStage); 
	},

	updateGroundY() {
		this.groundY = Renderer.gameHeight - (this.currentFloorIndex * Renderer.floorHeight) - 16;
		this.y = this.groundY - this.height;
	},

	walk(direction) {
		if (this.isStunned || this.isSlipping) return; 
		this.isDodging = false; 
		if (direction === 'right') { this.vx = this.speed; this.facingRight = true; }
		else if (direction === 'left') { this.vx = -this.speed; this.facingRight = false; }
		this.savedVx = this.vx; 
	},
	stop() { 
		if (this.vx !== 0) { this.savedVx = this.vx; this.stopTime = new Date().getTime(); }
		this.vx = 0; 
	},
	jump() {
		if (this.isGrounded && !this.isStunned && !this.isSlipping) {
			this.isDodging = false; 
			this.vy = this.jumpPower; this.isGrounded = false;
			AudioSystem.playJump(); // ★ 점프 효과음
		}
	},
	dodge() {
		if (this.isGrounded && !this.isStunned && !this.isSlipping) {
			this.isDodging = true; 
			this.vx = 0; 
		}
	},

	dropPackage() {
		if (this.isGrounded && !this.isStunned && !this.isSlipping && this.packages > 0) {
			this.isDodging = false; 
			this.savedVx = this.vx; this.vx = 0; this.isStunned = true; this.packages--; 

			let playerCenterX = this.x + this.width / 2;
			let stageData = MapGenerator.getStageData(GameInfo.currentStage);
			let currentDoors = stageData.floors[this.currentFloorIndex].doors;

			let nearestDist = 9999; let nearestIdx = -1; let nearestDoorX = 0;
			for(let i=0; i < currentDoors.length; i++) {
				let doorStartX = Renderer.elevWidth + 16 + (i * (Renderer.doorWidth + 16));
				let doorCenterX = doorStartX + (Renderer.doorWidth / 2);
				let dist = Math.abs(playerCenterX - doorCenterX);
				if (dist < nearestDist) {
					nearestDist = dist; nearestIdx = i; nearestDoorX = doorStartX;
				}
			}

			let snappedBoxX = nearestDoorX + (Renderer.doorWidth / 2) - 12;

			let isSuccess = false;
			if(currentDoors[nearestIdx] === 1) {
				isSuccess = true; currentDoors[nearestIdx] = 2; 
			}

			GameInfo.droppedBoxes.push({
				x: snappedBoxX, y: this.groundY - 24, floor: this.currentFloorIndex, photographed: false, timer: 0,
				isCorrect: isSuccess 
			});

			if (isSuccess) {
				GameInfo.score += 1000; ParticleSystem.spawn(snappedBoxX + 12, this.y, 10, true); 
			} else {
				GameInfo.life -= 1; 
				AudioSystem.playHit(); // ★ 패널티 효과음
				if (GameInfo.life <= 0) { GameInfo.gameOverReason = 'fired'; GameInfo.isGameOver = true; GameInfo.gameOverTime = Date.now(); AudioSystem.stopBGM(); }
			}

			clearTimeout(this.stunTimer);
			this.stunTimer = setTimeout(() => { this.isStunned = false; this.vx = this.savedVx; }, 500); 
		}
	},

	teleport(targetFloor, targetX) {
		if (this.isStunned || this.isSlipping) return; 
		this.isDodging = false;
		let unphotoed = GameInfo.droppedBoxes.filter(b => b.floor === this.currentFloorIndex && !b.photographed && b.isCorrect);
		if (unphotoed.length > 0) {
			ThiefSystem.start([unphotoed[0]], targetFloor, targetX, false);
			return; 
		}
		this.executeTeleport(targetFloor, targetX);
	},

	executeTeleport(targetFloor, targetX) {
		this.currentFloorIndex = targetFloor; this.x = targetX; this.updateGroundY();
		this.teleportCooldown = 60; 
		if (this.x < Renderer.width / 2) this.walk('right'); else this.walk('left');
	},

	clearStage() {
		let unphotoed = GameInfo.droppedBoxes.filter(b => b.floor === this.currentFloorIndex && !b.photographed && b.isCorrect);
		if (unphotoed.length > 0) {
			ThiefSystem.start([unphotoed[0]], 0, 0, true);
			return;
		}
		this.executeClearStage();
	},

	executeClearStage() {
		if (this.packages > 0) {
			GameInfo.life -= this.packages * 1.0;
			this.packages = 0; 
			AudioSystem.playHit();
			if (GameInfo.life <= 0) { GameInfo.gameOverReason = 'fired'; GameInfo.isGameOver = true; GameInfo.gameOverTime = Date.now(); AudioSystem.stopBGM(); return; }
		}
		GameInfo.isTransitioning = true;
		this.vx = 0; this.savedVx = 0;
	},

	update() {
		if (GameInfo.isGameOver) return; 

		if (this.invincibleTimer > 0) this.invincibleTimer--;

		if (this.isSlipping) {
			this.slipTimer--;
			if (this.slipTimer <= 0) { this.isSlipping = false; this.vx = this.savedVx; }
		}
		
		if (this.catTimer > 0) {
			this.catTimer--;
			if (this.catTimer <= 0) {
				this.isStunned = false;
				this.vx = this.savedVx; 
			}
		}

		if (this.invincibleTimer <= 0 && !this.isSlipping && !this.isStunned) {
			SmallEnemyManager.enemies.forEach((e, index) => {
				if (e.floor === this.currentFloorIndex && !e.isFading) {
					if (this.x < e.x + e.width && this.x + this.width > e.x &&
						this.y < e.y + e.height && this.y + this.height > e.y) {
						
						if (e.type === 'cat') {
							this.catTimer = 120; 
							this.isStunned = true; 
							this.savedVx = this.vx; 
							this.vx = 0; 
							AudioSystem.playHit(); // ★ 
							SmallEnemyManager.enemies.splice(index, 1); 
							ParticleSystem.spawn(this.x + this.width/2, this.y + this.height/2, 20, true);
						} else {
							GameInfo.life -= 0.5; 
							AudioSystem.playHit(); // ★ 
							if (GameInfo.life <= 0) { GameInfo.gameOverReason = 'hospital'; GameInfo.isGameOver = true; GameInfo.gameOverTime = Date.now(); AudioSystem.stopBGM(); return; }
							
							this.isSlipping = true; this.slipTimer = 30; 
							this.savedVx = this.vx; this.vx = 0;
							this.invincibleTimer = 30 + 120; 
							ParticleSystem.spawn(this.x + this.width/2, this.y + this.height/2, 10, true);
							e.isFading = true;
						}
					}
				}
			});
		}

		if (this.invincibleTimer <= 0 && !this.isDodging && !this.isSlipping) {
			MediumEnemyManager.enemies.forEach(e => {
				if (e.state === 'elevator' || e.state === 'waiting') return;
				
				if (e.floor === this.currentFloorIndex && !e.isFading) {
					if (this.x < e.x + e.width && this.x + this.width > e.x &&
						this.y < e.y + e.height && this.y + this.height > e.y) {
						
						GameInfo.life -= 1.0; 
						AudioSystem.playHit(); // ★ 
						if (GameInfo.life <= 0) { GameInfo.gameOverReason = 'hospital'; GameInfo.isGameOver = true; GameInfo.gameOverTime = Date.now(); AudioSystem.stopBGM(); return; }
						
						this.invincibleTimer = 120; 
						ParticleSystem.spawn(this.x + this.width/2, this.y + this.height/2, 15, true);
						
						if (e.type === 'blackcat') e.isFading = true;
					}
				}
			});
		}

		if (this.isSlipping || this.isStunned) {
			this.vx = 0;
		}

		let wasGrounded = this.isGrounded;
		this.vy += this.gravity; this.x += this.vx; this.y += this.vy;

		if (this.isGrounded && Math.abs(this.vx) > 0 && !this.isSlipping) {
			if (Math.random() < 0.3) ParticleSystem.spawn(this.x + this.width / 2 + (Math.random() * 10 - 5), this.groundY, 1, false);
		}

		if (this.y + this.height >= this.groundY) {
			this.y = this.groundY - this.height; this.vy = 0; this.isGrounded = true;
			
			if (this.vx !== 0) {
				this.vx = Math.sign(this.vx) * this.speed;
				this.savedVx = this.vx;
			}
			if (!wasGrounded) ParticleSystem.spawn(this.x + this.width / 2, this.groundY, 15, true);
		}

		if (this.x < 0) { this.x = 0; this.vx = 0; this.savedVx = 0; }
		if (this.x > Renderer.width - this.width) { this.x = Renderer.width - this.width; this.vx = 0; this.savedVx = 0; }

		if (this.teleportCooldown > 0) {
			this.teleportCooldown--;
		} else {
			const leftZone = 0; const rightZone = Renderer.width - Renderer.elevWidth;
			if (this.x <= leftZone + 10) {
				if (this.currentFloorIndex === 0) this.teleport(1, leftZone + 20);       
				else if (this.currentFloorIndex === 1) this.teleport(0, leftZone + 20); 
				else if (this.currentFloorIndex === 2) this.clearStage();               
			} 
			else if (this.x >= rightZone - 10) {
				if (this.currentFloorIndex === 1) this.teleport(2, rightZone - 20 - this.width);       
				else if (this.currentFloorIndex === 2) this.teleport(1, rightZone - 20 - this.width); 
			}
		}
	},

	render() {
		let spriteKey = 'driver_idle';
		if (this.isDodging) spriteKey = 'driver_lean';
		else if (this.isGrounded && Math.abs(this.vx) > 0) spriteKey = Math.floor(Date.now() / 150) % 2 === 0 ? 'driver_walk' : 'driver_idle';

		const img = Renderer.assets[spriteKey];
		let yOffset = (!this.isDodging && !this.isStunned && this.isGrounded && this.vx === 0 && Math.floor(Date.now() / 400) % 2 === 0 && !this.isSlipping) ? Math.floor(Renderer.scale) : 0;

		Renderer.ctx.save();
		if (this.invincibleTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) Renderer.ctx.globalAlpha = 0.5;

		let drawX = this.x; let drawY = this.y + yOffset;

		if (this.isSlipping) {
			Renderer.ctx.translate(drawX + this.width / 2, drawY + this.height);
			Renderer.ctx.rotate(this.facingRight ? -Math.PI/2 : Math.PI/2);
			Renderer.ctx.translate(-(drawX + this.width / 2), -(drawY + this.height));
		}

		if (!this.facingRight) {
			Renderer.ctx.translate(drawX + this.width, drawY);
			Renderer.ctx.scale(-1, 1); Renderer.ctx.drawImage(img, 0, 0);
		} else {
			Renderer.ctx.drawImage(img, drawX, drawY);
		}
		Renderer.ctx.restore();

		if (GameInfo.life <= 2 && !GameInfo.isGameOver) {
			let sweatBounce = Math.floor(Date.now() / 200) % 2 === 0 ? 0 : 3;
			Renderer.ctx.drawImage(Renderer.assets['effect_sweat'], drawX + this.width - 15, drawY + 10 + sweatBounce);
		}

		let handBaseY = this.y + 15 + yOffset;
		for (let i = 0; i < this.packages; i++) {
			Renderer.ctx.drawImage(Renderer.assets['box'], this.x + 12, handBaseY - (i * 18));
		}

		if (this.catTimer > 0) {
			Renderer.ctx.save();
			if (this.catTimer < 30) {
				Renderer.ctx.globalAlpha = this.catTimer / 30;
			}
			let catDrawY = handBaseY - (this.packages * 18) - 10;
			Renderer.ctx.drawImage(Renderer.assets['enemy_cat'], this.x + 12, catDrawY);
			Renderer.ctx.restore();
		}
	}
};

function restartGame() {
	GameInfo.score = 0; GameInfo.life = 5; GameInfo.currentStage = 1; GameInfo.isGameOver = false; GameInfo.droppedBoxes = [];
	GameInfo.timeFreeze = 0; GameInfo.flashTimer = 0;
	MapGenerator.cache = {}; 
	SmallEnemyManager.enemies = [];
	MediumEnemyManager.enemies = []; 
	ThiefSystem.active = false;
	ParticleSystem.particles = [];
	Player.init(); 
	IntroSystem.init(); 
	AudioSystem.playBGM(); // ★ 재시작 시 BGM 다시 켜기
}

function takePhoto() {
	if (GameInfo.isGameOver || IntroSystem.active || GameInfo.timeFreeze > 0) return;
	GameInfo.timeFreeze = 30; GameInfo.flashTimer = 5;  
	
	AudioSystem.playScore(); // ★ 사진 찰칵 효과음

	let currentBoxes = GameInfo.droppedBoxes.filter(b => b.floor === Player.currentFloorIndex && !b.photographed);
	currentBoxes.forEach(b => b.photographed = true);

	if (ThiefSystem.active && !ThiefSystem.isFleeing) {
		ThiefSystem.isFleeing = true; 
		ThiefSystem.boxesToSteal.forEach(steal => {
			steal.box.photographed = true;
			steal.box.x = steal.originalBoxX; 
		});
	}
}

const InputManager = {
	startX: 0, startY: 0, threshold: 30, lastTapTime: 0,
	init() {
		const canvas = document.getElementById('gameCanvas');
		window.addEventListener('pointerdown', (e) => { 
			// ★ 모바일 브라우저 사운드 정책 해결: 첫 터치 시 컨텍스트 해제 및 BGM 시작
			AudioSystem.init();
			AudioSystem.playBGM();

			const rect = canvas.getBoundingClientRect();
			const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
			const cx = (e.clientX - rect.left) * scaleX; const cy = (e.clientY - rect.top) * scaleY;
			
			if (GameInfo.isGameOver) return; 
			if (IntroSystem.active) return;

			const camX = Renderer.width - 120; const camY = Renderer.gameHeight + 15;
			const camImgWidth = Renderer.assets['camera'].width; const camImgHeight = Renderer.assets['camera'].height;

			if (cx >= camX - 10 && cx <= camX + camImgWidth + 10 && cy >= camY - 10 && cy <= camY + camImgHeight + 40) {
				takePhoto(); this.startX = -9999; return;
			}
			this.startX = e.clientX; this.startY = e.clientY; 
		});
		window.addEventListener('pointerup', (e) => {
			const rect = canvas.getBoundingClientRect();
			const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
			const cx = (e.clientX - rect.left) * scaleX; const cy = (e.clientY - rect.top) * scaleY;

			if (GameInfo.isGameOver) { 
				if (cx > 50 && cx < Renderer.width - 50 && cy > Renderer.gameHeight / 2 + 50 && cy < Renderer.gameHeight / 2 + 90) {
					restartGame(); 
				}
				return; 
			}
			if (IntroSystem.active || this.startX === -9999 || GameInfo.timeFreeze > 0) return;

			if (Player.isStunned || Player.isSlipping) return;

			const dx = e.clientX - this.startX; const dy = e.clientY - this.startY;
			const currentTime = new Date().getTime();
			
			if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
				if (currentTime - this.lastTapTime < 300) {
					if (Player.savedVx !== 0) Player.vx = Player.savedVx * 2;
					else if (Player.vx !== 0) Player.vx = Player.vx * 2;
					Player.jump();
				}
				this.lastTapTime = currentTime; return;
			}
			if (Math.abs(dx) > Math.abs(dy)) {
				if (dx > this.threshold) Player.walk('right'); else if (dx < -this.threshold) Player.walk('left');
			} else {
				if (dy < -this.threshold) Player.dodge(); else if (dy > this.threshold) Player.dropPackage();
			}
		});
	}
};

// ==========================================
// 5. Engine Boot 
// ==========================================
const Engine = {
	start() {
		Renderer.init('gameCanvas');
		
		Renderer.preRender('elev', ELEV_DATA, Renderer.scale); Renderer.preRender('entrance', ENTRANCE_DATA, Renderer.scale);
		Renderer.preRender('greenDoor', GREEN_DOOR_DATA, Renderer.scale); Renderer.preRender('yellowDoor', YELLOW_DOOR_DATA, Renderer.scale);
		Renderer.preRender('door_open', DOOR_OPEN_DATA, Renderer.scale); 
		Renderer.preRender('beam', BEAM_DATA, 4); Renderer.preRender('camera', CAMERA_DATA, 3); 
		Renderer.preRender('box', BOX_DATA, 3); Renderer.preRender('driver_idle', DRIVER_IDLE, 3);
		Renderer.preRender('driver_walk', DRIVER_WALK, 3); Renderer.preRender('driver_lean', DRIVER_LEAN, 3);
		Renderer.preRender('heart_full', HEART_FULL, 2); Renderer.preRender('heart_half', HEART_HALF, 2); 
		Renderer.preRender('heart_empty', HEART_EMPTY, 2); Renderer.preRender('bill_1000', BILL_1000, 3); 
		Renderer.preRender('bill_10000', BILL_10000, 3); Renderer.preRender('bill_50000', BILL_50000, 3); 
		Renderer.preRender('truck', TRUCK_DATA, 4); 
		Renderer.preRender('enemy_banana', ENEMY_BANANA, 3);
		Renderer.preRender('enemy_baseball', ENEMY_BASEBALL, 3); 
		Renderer.preRender('enemy_trashbag', ENEMY_TRASHBAG, 3); 
		Renderer.preRender('enemy_pigeon1', ENEMY_PIGEON1, 3); Renderer.preRender('enemy_pigeon2', ENEMY_PIGEON2, 3);
		Renderer.preRender('enemy_cat', ENEMY_CAT, 3);
		Renderer.preRender('enemy_vase1', ENEMY_VASE1, 3); Renderer.preRender('enemy_vase2', ENEMY_VASE2, 3);
		
		Renderer.preRender('med_kid_1', MED_KID_1, 3); Renderer.preRender('med_kid_2', MED_KID_2, 3);
		Renderer.preRender('med_tosa_1', MED_TOSA_1, 3); Renderer.preRender('med_tosa_2', MED_TOSA_2, 3); 
		Renderer.preRender('med_kickboard', MED_KICKBOARD, 3);
		Renderer.preRender('med_blackcat_1', MED_BLACKCAT_1, 3); Renderer.preRender('med_blackcat_2', MED_BLACKCAT_2, 3);

		Renderer.preRender('boss_idle_1', BOSS_IDLE_1, 4); Renderer.preRender('boss_idle_2', BOSS_IDLE_2, 4);
		Renderer.preRender('driver_bow_1', DRIVER_BOW_1, 4); Renderer.preRender('driver_bow_2', DRIVER_BOW_2, 4);
		Renderer.preRender('ambulance', AMBULANCE, 4);
		Renderer.preRender('effect_sweat', EFFECT_SWEAT, 3); 

		InputManager.init(); Player.init(); IntroSystem.init(); 
		this.loop();
	},
	
	loop() {
		if (GameInfo.isGameOver) { 
			Renderer.clear(); Renderer.ctx.save();
			Renderer.ctx.beginPath(); Renderer.ctx.rect(0, 0, Renderer.width, Renderer.gameHeight); Renderer.ctx.clip(); 
			Renderer.drawStageBlock(GameInfo.currentStage, 0); 
			Renderer.ctx.restore(); Renderer.drawUI(); 
			requestAnimationFrame(() => Engine.loop()); 
			return; 
		}

		if (GameInfo.timeFreeze > 0) { GameInfo.timeFreeze--; ParticleSystem.update(); } 
		else if (ThiefSystem.active) { ThiefSystem.update(); ParticleSystem.update(); } 
		else if (IntroSystem.active) { IntroSystem.update(); } 
		else {
			ParticleSystem.update(); 
			SmallEnemyManager.update(); 
			MediumEnemyManager.update(); 
			
			let autoStealTarget = null;
			GameInfo.droppedBoxes.forEach(b => {
				if (!b.photographed && b.isCorrect) {
					b.timer++;
					if (b.timer >= 120 && b.floor === Player.currentFloorIndex) {
						autoStealTarget = b;
					}
				}
			});

			if (autoStealTarget) {
				ThiefSystem.start([autoStealTarget], Player.currentFloorIndex, Player.x, false, true);
			} else if (!GameInfo.isTransitioning) {
				Player.update(); 
			} else {
				GameInfo.cameraOffsetY += GameInfo.transitionSpeed;
				if (GameInfo.cameraOffsetY >= Renderer.gameHeight) {
					GameInfo.isTransitioning = false; GameInfo.cameraOffsetY = 0;
					GameInfo.currentStage++; GameInfo.droppedBoxes = []; Player.resetForNewStage(); 
				}
			}
		}
		
		Renderer.clear(); Renderer.ctx.save();
		Renderer.ctx.beginPath(); Renderer.ctx.rect(0, 0, Renderer.width, Renderer.gameHeight); Renderer.ctx.clip(); 
		
		if (!GameInfo.isTransitioning) {
			Renderer.drawStageBlock(GameInfo.currentStage, 0); Renderer.drawDroppedBoxes(0); 
			SmallEnemyManager.render(Renderer.ctx, 0); 
			MediumEnemyManager.render(Renderer.ctx, 0); 
			ThiefSystem.render(Renderer.ctx); 
			
			if (IntroSystem.active) {
				Renderer.ctx.save(); Renderer.ctx.globalAlpha = 1.0 - Math.max(0, IntroSystem.opacity);
				Player.render(); Renderer.ctx.restore(); IntroSystem.render(Renderer.ctx);
			} else { Player.render(); }
			ParticleSystem.render(Renderer.ctx); 
			
			if (GameInfo.flashTimer > 0) {
				Renderer.ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; Renderer.ctx.fillRect(0, 0, Renderer.width, Renderer.gameHeight);
				GameInfo.flashTimer--;
			}
		} else {
			Renderer.drawStageBlock(GameInfo.currentStage, GameInfo.cameraOffsetY);
			Renderer.drawStageBlock(GameInfo.currentStage + 1, GameInfo.cameraOffsetY - Renderer.gameHeight);
		}
		
		Renderer.ctx.restore(); Renderer.drawUI(); 
		requestAnimationFrame(() => Engine.loop()); 
	}
};

Engine.start();
</script>
